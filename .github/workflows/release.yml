name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则使用 package.json 中的版本）"
        required: false
        type: string
      dry-run:
        description: "仅构建不发布"
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate release sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun x oxlint src test scripts
      - run: cargo fmt -- --check
      - run: cargo clippy --locked -- -D warnings
      - run: bun run typecheck

  # ── 多平台 napi 构建（每个平台用原生 runner，避免交叉编译） ──
  build-napi:
    name: Build napi (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview

      - run: bun install --frozen-lockfile

      - name: Build napi (${{ matrix.target }})
        run: bun run build:pgo --select --target ${{ matrix.target }}

      - name: Build JS and run integration tests
        run: bun run build:vite && bun run build:tsc && bun run test

      - name: Upload PGO build record
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pgo-${{ matrix.target }}
          path: |
            target/pgo/${{ matrix.target }}/build.json
            target/pgo/${{ matrix.target }}/benchmark.json
          if-no-files-found: error

      - name: Upload .node artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: napi-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  # ── JS 层构建 + npm 发布（聚合所有平台 .node 到一个包） ─────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [validate, build-napi]
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # 下载所有平台的 .node 原生二进制
      - name: Download all .node artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: napi-*
          path: .
          merge-multiple: true

      # 构建 JS 层（vite + tsc）
      - name: Build JS layer
        run: bun run build:vite && bun run build:tsc

      # 验证所有文件就绪
      - name: Verify final package
        run: |
          echo "=== Native binaries ==="
          ls -la *.node
          echo "=== dist ==="
          ls -la dist/

      # npm 发布
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VER"

      - name: Apply version
        run: |
          node -e "
            const p = require('./package.json');
            p.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Publish to npm
        if: inputs.dry-run != true
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create GitHub Release
        if: inputs.dry-run != true
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
