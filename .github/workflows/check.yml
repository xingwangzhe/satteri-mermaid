name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - run: bun install --frozen-lockfile

      - name: Run oxlint (JS/TS)
        run: bun run lint

      - name: Check formatting (oxfmt)
        run: bun run fmt:check

      - name: Cargo fmt (Rust)
        run: cargo fmt -- --check

      - name: Clippy (Rust)
        run: cargo clippy --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.14.0"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-24.04-arm
            node: "24"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95.0"

      - run: bun install --frozen-lockfile

      - name: Build napi (debug)
        run: bun run build:debug

      - name: Check TypeScript (source and tests)
        run: bun run typecheck

      - name: Run tests (vitest)
        run: bun run test

      - name: Build example using the local package
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: bun run build:example
