
[package]
authors = ["xingwangzhe"]
edition = "2021"
rust-version = "1.95"
name = "mermaid-rs"
version = "0.8.4"

[lib]
crate-type = ["cdylib"]

[features]
pgo = []

[dependencies]
napi-derive = "3.7.1"
merman = { version = "=0.10.0", default-features = false, features = [
  "all-diagrams",
  "svg",
  "layout-cytoscape",
] }
serde_json = "1"

[dependencies.napi]
version = "3.16.2"
features = ["napi10"]

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"
